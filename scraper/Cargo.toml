[package]
name = "scraper"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "scraper"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
roxmltree = "0.20"
sqlx = { version = "0.8", features = ["mysql", "runtime-tokio", "chrono", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"